mod_loader=neoforge

included_projects=:api, :common, :common-client

neoforge_version=21.1.1
neoforge_dependency=[21.0.0-beta,)

modrinth_upload_supported_game_versions=1.21, 1.21.1
curseforge_upload_minecraft_versions=1.21, 1.21.1

# Optional dependencies
curseforge_upload_optional_dependencies=simple-voice-chat, cloth-config
modrinth_upload_optional_dependencies=simple-voice-chat, cloth-config

# This fork builds artifacts locally and in GitHub Actions.
enable_curseforge_upload=false
enable_modrinth_upload=false
enable_mod_update=false

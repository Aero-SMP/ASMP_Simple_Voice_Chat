name: Build NeoForge 1.21.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build stable NeoForge mod
        run: ./gradlew clean build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: voicechat-neoforge-1.21.1-2.6.22
          path: neoforge/build/libs/voicechat-neoforge-1.21.1-2.6.22.jar
          if-no-files-found: error
